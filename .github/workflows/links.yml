name: Check links

on:
  push:
    branches:
      - main
  pull_request:
  schedule:
    - cron: "23 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  links:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Check links
        uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2.6.1
        with:
          args: >-
            --verbose
            --no-progress
            --accept 200,204,206,429
            --exclude https://blog\.bahraniapps\.com/.*
            --exclude https://www\.adobe\.com/.*
            --exclude https://www\.anaconda\.com/.*
            --exclude https://www\.tableau\.com/.*
            README.md CONTRIBUTING.md
          fail: true
